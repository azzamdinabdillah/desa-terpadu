# =============================================================================
# Docker Compose - Production
# Desa Terpadu - Laravel 12 + React + Inertia.js
# =============================================================================

name: desa-terpadu

services:

  # ---------------------------------------------------------------------------
  # Application (PHP-FPM + Nginx)
  # ---------------------------------------------------------------------------
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: production
    container_name: desa-terpadu-app
    restart: unless-stopped
    environment:
      APP_NAME: "${APP_NAME:-Desa Terpadu}"
      APP_ENV: production
      APP_KEY: "${APP_KEY}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_URL: "${APP_URL}"
      APP_LOCALE: id
      APP_FALLBACK_LOCALE: en
      APP_MAINTENANCE_DRIVER: file
      BCRYPT_ROUNDS: 12
      LOG_CHANNEL: stack
      LOG_STACK: single
      LOG_LEVEL: "${LOG_LEVEL:-warning}"
      # Database
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: "${DB_DATABASE:-desa_terpadu}"
      DB_USERNAME: "${DB_USERNAME:-desa_user}"
      DB_PASSWORD: "${DB_PASSWORD}"
      # Session & Cache
      SESSION_DRIVER: "${SESSION_DRIVER:-database}"
      SESSION_LIFETIME: 120
      CACHE_STORE: "${CACHE_STORE:-database}"
      QUEUE_CONNECTION: database
      # Redis
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PASSWORD: "${REDIS_PASSWORD:-null}"
      REDIS_PORT: 6379
      # Mail
      MAIL_MAILER: "${MAIL_MAILER:-smtp}"
      MAIL_HOST: "${MAIL_HOST}"
      MAIL_PORT: "${MAIL_PORT:-587}"
      MAIL_USERNAME: "${MAIL_USERNAME}"
      MAIL_PASSWORD: "${MAIL_PASSWORD}"
      MAIL_ENCRYPTION: "${MAIL_ENCRYPTION:-tls}"
      MAIL_FROM_ADDRESS: "${MAIL_FROM_ADDRESS}"
      MAIL_FROM_NAME: "${MAIL_FROM_NAME:-Desa Terpadu}"
      # Filesystem
      FILESYSTEM_DISK: local
    ports:
      - "${APP_PORT:-8181}:80"
    volumes:
      - app-storage:/var/www/html/storage
      - app-cache:/var/www/html/bootstrap/cache
    networks:
      - desa-terpadu-network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/up"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ---------------------------------------------------------------------------
  # MySQL Database
  # ---------------------------------------------------------------------------
  db:
    image: mysql:8.4
    container_name: desa-terpadu-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD}"
      MYSQL_DATABASE: "${DB_DATABASE:-desa_terpadu}"
      MYSQL_USER: "${DB_USERNAME:-desa_user}"
      MYSQL_PASSWORD: "${DB_PASSWORD}"
    ports:
      - "${DB_EXTERNAL_PORT:-3307}:3306"
    volumes:
      - db-data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./mysql/my.cnf:/etc/mysql/conf.d/custom.cnf:ro
    networks:
      - desa-terpadu-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Redis Cache & Queue
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7.4-alpine
    container_name: desa-terpadu-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
    ports:
      - "${REDIS_EXTERNAL_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    networks:
      - desa-terpadu-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Nginx Proxy (Optional - for HTTPS/SSL termination with certbot)
  # ---------------------------------------------------------------------------
  # Uncomment if you want a dedicated reverse proxy layer
  # proxy:
  #   image: nginx:1.27-alpine
  #   container_name: desa-terpadu-proxy
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx/proxy.conf:/etc/nginx/conf.d/default.conf:ro
  #     - certbot-www:/var/www/certbot:ro
  #     - certbot-conf:/etc/letsencrypt:ro
  #   networks:
  #     - desa-terpadu-network
  #   depends_on:
  #     - app

  # ---------------------------------------------------------------------------
  # Certbot (SSL - Let's Encrypt)
  # ---------------------------------------------------------------------------
  # certbot:
  #   image: certbot/certbot:latest
  #   container_name: desa-terpadu-certbot
  #   volumes:
  #     - certbot-www:/var/www/certbot
  #     - certbot-conf:/etc/letsencrypt
  #   entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

# =============================================================================
# Volumes
# =============================================================================
volumes:
  db-data:
    driver: local
  redis-data:
    driver: local
  app-storage:
    driver: local
  app-cache:
    driver: local
  # certbot-www:
  # certbot-conf:

# =============================================================================
# Networks
# =============================================================================
networks:
  desa-terpadu-network:
    driver: bridge
